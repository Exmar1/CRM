<li id='task-{{ task.id }}' class='task-item'>
	<a href="{% url 'task_detail' task.id %}">
		<span class='task-name'>{{ task.name }}</span>
		<span class='task-status'>{{ task.get_status_display }}</span>
		<span class='task-desc'>{{ task.description|truncatechars:30 }}</span>
  </a>
	<form method="POST" action="{% url 'delete_task' task.id %}" style="display:inline;" onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
	</form>
</li>
