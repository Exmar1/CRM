<li id='task-{{ task.id }}' class='task-item'>
	<a href="{% url 'task_detail' task.id %}">
		<span class='task-name'>{{ task.name }}</span>
		<span class='task-status'>{{ task.get_status_display }}</span>
		<span class='task-desc'>{{ task.description|truncatechars:30 }}</span>
  </a>
	<button class='delete-btn' data-task-id='{{ task.id }}'>Удалить</button>
</li>
