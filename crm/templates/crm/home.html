{% extends "crm/base.html" %} {% load static %}

{% block content %}
<div class="container">
    <h1>Мои Задачи</h1>

    <button id="open-form-btn" class="btn btn-primary">Добавить задачу</button>

    <div id="task-form" style="display: none;">
        <form id="task-form-element" method="POST" action="{% url 'create_task' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Сохранить</button>
            <button type="button" class="btn btn-secondary" onclick="toggleTaskForm()">Отмена</button>
        </form>
    </div>

    <div class="tasks-container">
        <ul id="task-list">
            {% for task in tasks %}
                {% include 'crm/task_item.html' %}
            {% endfor %}
        </ul>
    </div>

    <div id="task-menu" style="display: none;">
        <h2 id="task-title"></h2>
        <p id="task-description"></p>
        <p><strong>Статус:</strong> <span id="task-status"></span></p>
        <button onclick="closeTaskDetails()" class="btn btn-primary">Закрыть</button>
    </div>
</div>

<script>
function toggleTaskForm() {
    var taskForm = document.getElementById('task-form');
    taskForm.style.display = taskForm.style.display === 'none' ? 'block' : 'none';
}

document.getElementById('task-form-element').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    
    fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.text())
    .then(html => {
        // Добавляем новую задачу в список
        document.getElementById('task-list').insertAdjacentHTML('beforeend', html);
        
        // Очищаем форму
        form.reset();
        
        // Скрываем форму
        toggleTaskForm();
    })
    .catch(error => {
        console.error('Ошибка:', error);
    });
});
</script>
{% endblock content %}
